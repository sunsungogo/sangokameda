<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800" font-family="'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8472A"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="860" height="800" fill="#f5f3f0"/>

  <!-- title block -->
  <text x="430" y="34" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" letter-spacing="3" fill="#E8472A">JOUSAI CARE MODEL</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Shippori Mincho', serif" font-size="24" font-weight="700" fill="#111">情災ケアモデル ― 理想設計図</text>
  <text x="430" y="86" text-anchor="middle" font-size="11.5" fill="#888">気象データと身体データの掛け合わせから、通知・配慮・回復までをつなぐ一連の流れ</text>

  <!-- 行政・自治体 -->
  <rect x="40" y="112" width="230" height="92" rx="4" fill="#ffffff" stroke="#ddd"/>
  <text x="58" y="138" font-size="13.5" font-weight="700" fill="#111">行政・自治体</text>
  <text x="58" y="162" font-size="11.5" fill="#666">気象・災害情報</text>
  <text x="58" y="180" font-size="11.5" fill="#666">警報・避難情報</text>

  <!-- 個人デバイス -->
  <rect x="590" y="112" width="230" height="92" rx="4" fill="#ffffff" stroke="#ddd"/>
  <text x="608" y="138" font-size="13.5" font-weight="700" fill="#111">個人デバイス</text>
  <text x="608" y="162" font-size="11.5" fill="#666">HRV・睡眠スコア</text>
  <text x="608" y="180" font-size="11.5" fill="#666">身体データ（自動）</text>

  <!-- 情災スコア算出 (center) -->
  <rect x="310" y="300" width="240" height="132" rx="4" fill="#fce0d8" stroke="#E8472A" stroke-width="1.3"/>
  <text x="430" y="330" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a3382a">情災スコア算出</text>
  <text x="430" y="354" text-anchor="middle" font-size="11" fill="#8a4638">気象イベント × 身体データ</text>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#8a4638">同トリガーが重なったとき検知</text>
  <text x="430" y="396" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a3382a">→ 情災リスク判定</text>

  <!-- 職場・企業 -->
  <rect x="40" y="322" width="196" height="110" rx="4" fill="#ffffff" stroke="#ddd"/>
  <text x="58" y="348" font-size="13.5" font-weight="700" fill="#111">職場・企業</text>
  <text x="58" y="372" font-size="11.5" fill="#666">特例休暇の判断</text>
  <text x="58" y="390" font-size="11.5" fill="#666">配慮・対応</text>

  <!-- 凡例 -->
  <rect x="614" y="300" width="206" height="150" rx="4" fill="#efede9" stroke="#ddd"/>
  <text x="630" y="322" font-size="11" font-weight="700" fill="#111">凡例</text>
  <line x1="630" y1="338" x2="662" y2="338" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text x="670" y="342" font-size="10.5" fill="#666">情報の流れ</text>
  <line x1="630" y1="360" x2="662" y2="360" stroke="#E8472A" stroke-width="1.6" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent)"/>
  <text x="670" y="364" font-size="10.5" fill="#666">双方向連携</text>
  <line x1="630" y1="382" x2="662" y2="382" stroke="#E8472A" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-accent)"/>
  <text x="670" y="386" font-size="10.5" fill="#666">フィードバック</text>
  <rect x="630" y="398" width="12" height="12" fill="#ffffff" stroke="#ddd"/>
  <text x="650" y="408" font-size="10.5" fill="#666">行政・個人 入力</text>
  <rect x="630" y="420" width="12" height="12" fill="#fce0d8" stroke="#E8472A"/>
  <text x="650" y="430" font-size="10.5" fill="#666">判定・出力</text>

  <!-- arrows: 行政 -> スコア算出 -->
  <line x1="180" y1="204" x2="360" y2="298" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <!-- arrows: 個人デバイス -> スコア算出 -->
  <line x1="680" y1="204" x2="500" y2="298" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <!-- 職場 <-> スコア算出 (double arrow) -->
  <line x1="238" y1="378" x2="308" y2="378" stroke="#E8472A" stroke-width="1.6" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent)"/>
  <text x="273" y="368" text-anchor="middle" font-size="10.5" fill="#a3382a">情報共有</text>

  <!-- スコア算出 -> 通知 -->
  <line x1="430" y1="432" x2="430" y2="470" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <!-- 本人への通知・ケア案内 -->
  <rect x="280" y="470" width="300" height="96" rx="4" fill="#fdf1ec" stroke="#E8472A" stroke-width="1"/>
  <text x="430" y="498" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a3382a">本人への通知・ケア案内</text>
  <text x="430" y="522" text-anchor="middle" font-size="11" fill="#8a4638">「情災状態かもしれません」</text>
  <text x="430" y="542" text-anchor="middle" font-size="11" fill="#8a4638">休暇申請テンプレ／相談先案内</text>

  <!-- 通知 -> モニタリング -->
  <line x1="430" y1="566" x2="430" y2="604" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <!-- 回復モニタリング -->
  <rect x="180" y="604" width="500" height="114" rx="4" fill="#efede9" stroke="#ddd"/>
  <text x="430" y="628" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">回復モニタリング</text>
  <line x1="430" y1="640" x2="430" y2="704" stroke="#ddd" stroke-width="1"/>
  <text x="310" y="654" text-anchor="middle" font-size="11" font-weight="700" fill="#666">客観指標</text>
  <text x="310" y="674" text-anchor="middle" font-size="10.5" fill="#888">HRV・睡眠スコア</text>
  <text x="310" y="692" text-anchor="middle" font-size="10.5" fill="#888">平時との差分</text>
  <text x="550" y="654" text-anchor="middle" font-size="11" font-weight="700" fill="#666">主観指標</text>
  <text x="550" y="674" text-anchor="middle" font-size="10.5" fill="#888">「昨日より楽ですか？」</text>
  <text x="550" y="692" text-anchor="middle" font-size="10.5" fill="#888">一問チェック</text>

  <!-- モニタリング -> 段階的回復 -->
  <line x1="430" y1="718" x2="430" y2="750" stroke="#999" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <!-- 情災からの段階的回復 -->
  <rect x="255" y="750" width="350" height="40" rx="4" fill="#111111"/>
  <text x="430" y="775" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">情災からの段階的回復</text>

  <!-- feedback dashed path: モニタリング -> 職場・企業 -->
  <path d="M 178 660 C 90 660, 90 500, 90 432" fill="none" stroke="#E8472A" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-accent)"/>
  <text x="52" y="560" font-size="10" fill="#a3382a" transform="rotate(-90 52 560)" text-anchor="middle">回復状況フィードバック</text>
</svg>
